<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 Amour Très Sucré — Édition Anniversaire 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #f4a0c0;
  --rose-fonce: #d4607a;
  --rose-pale: #fde8f0;
  --bleu-nuit: #1a0a2e;
  --violet: #6b2fa0;
  --or: #f0c060;
  --texte: #2a0a1a;
  --blanc: #fff8fc;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  font-family:'Quicksand',sans-serif;
  background:#000;
}

/* ── ÉTOILES ── */
.stars { position:fixed; inset:0; pointer-events:none; z-index:0; }
.star { position:absolute; border-radius:50%; background:white; animation:twinkle 3s infinite ease-in-out; }
@keyframes twinkle { 0%,100%{opacity:.2;transform:scale(1)} 50%{opacity:1;transform:scale(1.4)} }

/* ── CONTENEUR PLEIN ÉCRAN ── */
#game {
  position:relative; width:100vw; height:100vh;
  display:flex; flex-direction:column;
  overflow:hidden; z-index:1;
}

/* ── FOND DÉCOR ── */
#scene-bg {
  position:absolute; inset:0; z-index:0;
  background-size:cover; background-position:center;
  transition:opacity .6s ease;
}
#scene-overlay {
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.15) 50%, rgba(0,0,0,.1) 100%);
}

/* ── PERSONNAGE ── */
#character-display {
  position:absolute; bottom:200px; left:50%; transform:translateX(-50%);
  z-index:2;
  max-height:65vh; max-width:50vw;
  object-fit:contain;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));
  animation:float 5s ease-in-out infinite;
  transition:opacity .4s ease, transform .4s ease;
}
@keyframes float { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-10px)} }

/* ── BARRE DE TITRE ── */
#title-bar {
  position:relative; z-index:5;
  text-align:center; padding:10px 16px;
  background:rgba(10,0,20,.75);
  border-bottom:1px solid rgba(244,160,192,.3);
  backdrop-filter:blur(6px);
}
#title-bar span {
  font-family:'Playfair Display',serif; font-style:italic;
  color:var(--rose); font-size:.85rem; letter-spacing:1px;
}

/* ── STATS ── */
#stats-bar {
  position:relative; z-index:5;
  display:flex; gap:16px; justify-content:center;
  padding:6px 16px;
  background:rgba(10,0,20,.55);
  backdrop-filter:blur(4px);
  flex-wrap:wrap;
}
.stat-item { font-size:.78rem; color:var(--rose-pale); display:flex; align-items:center; gap:5px; }
.stat-heart { color:var(--rose); }

/* ── BOÎTE DIALOGUE ── */
#dialog-box {
  position:absolute; bottom:0; left:0; right:0; z-index:10;
  padding:18px 28px 20px;
  background:rgba(10,0,20,.88);
  border-top:2px solid rgba(244,160,192,.5);
  backdrop-filter:blur(12px);
  min-height:200px; max-height:42vh;
  display:flex; flex-direction:column; gap:10px;
}
#speaker-name {
  font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700;
  color:var(--rose-fonce); background:rgba(255,248,252,.12);
  border:2px solid var(--rose); border-radius:20px;
  padding:3px 16px; display:inline-block; width:fit-content;
  box-shadow:3px 3px 0 rgba(212,96,122,.4);
}
#dialog-text {
  font-size:1rem; line-height:1.7; color:#f5e8ee;
  overflow-y:auto; max-height:100px;
}
#dialog-text::-webkit-scrollbar { width:3px; }
#dialog-text::-webkit-scrollbar-thumb { background:var(--rose); border-radius:4px; }

/* ── CHOIX ── */
#choices { display:flex; flex-direction:column; gap:7px; margin-top:4px; }
.choice-btn {
  background:rgba(255,248,252,.08);
  border:1.5px solid rgba(244,160,192,.6); border-radius:10px;
  padding:9px 16px;
  font-family:'Quicksand',sans-serif; font-size:.95rem; font-weight:600;
  color:#f5e8ee; cursor:pointer; text-align:left;
  transition:all .2s ease;
  backdrop-filter:blur(4px);
}
.choice-btn:hover { background:var(--rose-fonce); color:white; transform:translateX(5px); border-color:var(--rose); }

/* ── BOUTON SUIVANT ── */
#next-btn {
  align-self:flex-end; margin-top:4px;
  background:var(--rose-fonce); border:none; border-radius:20px;
  padding:8px 22px;
  font-family:'Quicksand',sans-serif; font-size:.9rem; font-weight:700;
  color:white; cursor:pointer;
  box-shadow:3px 3px 0 #8a2040;
  transition:all .2s ease;
}
#next-btn:hover { transform:translateY(-2px); box-shadow:4px 5px 0 #8a2040; }
#next-btn.hidden { display:none; }

/* ── ÉCRAN DÉMARRAGE ── */
#start-screen {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(135deg,#1a0a2e 0%,#2d0a3e 50%,#0d0520 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; padding:28px;
}
.title-sparkle {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.8rem,5vw,3rem); color:var(--rose);
  text-align:center; text-shadow:0 0 30px rgba(244,160,192,.6); line-height:1.3;
}
#name-input-wrap { display:flex; flex-direction:column; gap:10px; align-items:center; width:100%; max-width:320px; }
#name-input-wrap label { color:var(--rose-pale); font-size:.9rem; font-weight:600; text-align:center; }
#player-name-input {
  width:100%; padding:12px 18px; border-radius:30px; border:2px solid var(--rose);
  background:rgba(255,248,252,.1); color:white;
  font-family:'Quicksand',sans-serif; font-size:1rem; text-align:center; outline:none;
  transition:all .3s ease;
}
#player-name-input:focus { border-color:var(--or); box-shadow:0 0 20px rgba(240,192,96,.3); }
#player-name-input::placeholder { color:rgba(255,255,255,.3); }
#start-btn {
  background:linear-gradient(135deg,var(--rose-fonce),var(--violet));
  border:none; border-radius:30px; padding:14px 40px;
  font-family:'Playfair Display',serif; font-size:1.1rem; color:white;
  cursor:pointer; letter-spacing:1px;
  box-shadow:0 4px 20px rgba(244,160,192,.4); transition:all .3s ease;
}
#start-btn:hover { transform:scale(1.05); box-shadow:0 8px 30px rgba(244,160,192,.6); }
.birthday-tag { font-size:.8rem; color:rgba(255,255,255,.4); text-align:center; font-style:italic; }

/* ── ÉCRAN FIN ── */
#end-screen {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(135deg,#1a0a2e,#2d0a3e);
  display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:20px; padding:32px; text-align:center;
}
#end-screen.visible { display:flex; }
#end-emoji { font-size:5rem; animation:float2 3s ease-in-out infinite; }
@keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
#end-title {
  font-family:'Playfair Display',serif;
  font-size:clamp(1.4rem,4vw,2.2rem); color:var(--rose);
  text-shadow:0 0 20px rgba(244,160,192,.5);
}
#end-char { max-height:35vh; object-fit:contain; filter:drop-shadow(0 10px 30px rgba(244,160,192,.4)); }
#end-text { color:var(--rose-pale); font-size:.95rem; line-height:1.7; max-width:500px; white-space:pre-line; }
#restart-btn {
  background:var(--rose-fonce); border:none; border-radius:20px;
  padding:10px 28px; color:white;
  font-family:'Quicksand',sans-serif; font-size:1rem; font-weight:700; cursor:pointer;
  transition:all .2s ease;
}
#restart-btn:hover { transform:scale(1.05); }

/* On rend le jeu "scrollable" */
@media (max-width: 768px) {
  html, body {
    height: auto;
    min-height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #game {
    height: auto;
    min-height: 100vh;
    overflow: visible;
    padding-bottom: 220px;
  }

  #dialog-box {
    position: relative;
    bottom: auto;
    margin-top: 60vh;
  }
}

/* ── ANIM TEXTE ── */
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn .4s ease forwards; }

/* ── CŒUR PARTICULE ── */
.heart-pop {
  position:fixed; z-index:200; font-size:2rem; pointer-events:none;
  animation:heartFly 1.2s ease forwards;
}
@keyframes heartFly { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(1.5)} }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- ÉCRAN DÉMARRAGE -->
<div id="start-screen">
  <div style="font-size:3rem">💖✨💖</div>
  <div class="title-sparkle">Amour Très Sucré<br><span style="color:var(--or);font-size:70%">— Édition Spéciale Anniversaire —</span></div>
  <div style="color:var(--rose-pale);font-size:.95rem;text-align:center;font-style:italic">Une aventure romantique totalement normale<br>avec des personnages absolument cohérents</div>
  <div id="name-input-wrap">
    <label>✨ Entre le prénom de l'héroïne ✨</label>
    <input type="text" id="player-name-input" placeholder="Margotte..." maxlength="20" autocomplete="off">
  </div>
  <button id="start-btn" onclick="startGame()">Commencer l'aventure 💕</button>
  <div class="birthday-tag">Un cadeau fait avec amour (et beaucoup d'absurdité)</div>
</div>

<!-- JEU -->
<div id="game">
  <div id="scene-bg"></div>
  <div id="scene-overlay"></div>
  <div id="title-bar"><span>💖 Amour Très Sucré — Épisode 1 💖</span></div>
  <div id="stats-bar">
    <div class="stat-item"><span class="stat-heart">❤️</span> Léon : <span id="stat-leon">0</span></div>
    <div class="stat-item"><span class="stat-heart">💜</span> Rhea : <span id="stat-rhea">0</span></div>
    <div class="stat-item"><span class="stat-heart">💙</span> Rafayel : <span id="stat-rafayel">0</span></div>
    <div class="stat-item" id="stat-silus-wrap" style="display:none"><span class="stat-heart">🩵</span> ??? : <span id="stat-silus">0</span></div>
  </div>
  <img id="character-display" src="" alt="" style="opacity:0">
  <div id="dialog-box">
    <div id="speaker-name">Narratrice</div>
    <div id="dialog-text"></div>
    <div id="choices"></div>
    <button id="next-btn" onclick="nextScene()">Suivant ▶</button>
  </div>
</div>

<!-- ÉCRAN FIN -->
<div id="end-screen">
  <div id="end-emoji">💖</div>
  <div id="end-title"></div>
  <img id="end-char" src="" alt="" style="display:none">
  <div id="end-text"></div>
  <button id="restart-btn" onclick="location.reload()">Rejouer 🔄</button>
</div>

<script>
// ── IMAGES ──
const IMGS = {
  portail: "img/decors/portail.webp",
  hall:    "img/decors/hall.webp",
  salle_de_classe:   "img/decors/salle_de_classe.png",
  lettre:  "img/objets/lettre.png",
  leon:    "img/personnages/Leon.png",
  rafayel: "img/personnages/Rafayel.png",
  rhea:    "img/personnages/Rhea.png",
  sylus:   "img/personnages/Sylus.png",
  hakim:   "img/personnages/Hakim.png",
  none:    ""
};

// ── ÉTAT ──
let playerName = "Margotte";
let hearts = { leon:0, rhea:0, rafayel:0, silus:0 };
let currentScene = 0;
let secretFound = false;

// ── ÉTOILES ──
(function(){
  const c = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s=document.createElement('div'); s.className='star';
    const sz=Math.random()*2.5+1;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;`;
    c.appendChild(s);
  }
})();

// ── SCÈNES ──
const scenes = [
  // INTRO
  { bg:'portail', char:'none', speaker:"Narratrice",
    text:()=>`C'est un matin ordinaire à l'Académie du Destin Romantique™. ${playerName} franchit les portes dorées de l'établissement, sa chevelure volant gracieusement face à la douce brise d'été du mois de juin.`, next:true },
  { bg:'hall', char:'none', speaker:"Narratrice",
    text:()=>`La nouvelle élève s'avançait discrètement dans le hall du lycée, lorsque toudincou trois silhouettes mystérieuses se dressent devant elle. L'ambiance est dramatique. Une musique de piano dramatique envahit l'air. Personne ne sait d'où elle vient, te pose pas de questions c le scénario qui est comme ça en fait.`, next:true },
  { bg:'hall', char:'leon', speaker:"Narratrice",
    text:()=>`Le premier inconnu s'avance. Il porte un T-shirt bien moulant qui laisse apparaîte ses abdos SAILLANTS, et une expression qui dit clairement "j'ai survécu à Raccoon City mais ce lycée me terrifie quand même." Tout chez lui donne envie à ${playerName} de l'appeler daddy...`, next:true },
  { bg:'hall', char:'leon', speaker:"Léon S. Kennedy",
    text:()=>`...Tu as du gel pour les cheveux ? Les miens commencent à perdre leur volume depuis le troisième zombie que je viens de croiser en venant au bahut. C'est une urgence.`, next:true },
  { bg:'hall', char:'rhea', speaker:"Narratrice",
    text:()=>`La deuxième silhouette s'avance. Mommy mesure environ deux mètres, le corps DUR ET SEC, et porte des vêtements en cuir bien ajustés TAHH. Elle te regarde avec l'intensité de quelqu'un qui peut soulever un camion… mais qui lit aussi des romans à l'eau de rose.`, next:true },
  { bg:'hall', char:'rhea', speaker:"Rhea Ripley",
    text:()=>`Hey baby girl. Je m'appelle Rhea. Je suis catcheuse. La semaine dernière j'ai fracassé un type avec une chaise en ACIERRR. Cette semaine je veux apprendre à faire des cookies sucrés au sucre pour ma futur dulcinée. Elle te fait un clin d'œil aguicheur.`, next:true },
  { bg:'hall', char:'rafayel', speaker:"Narratrice",
    text:()=>`La troisième silhouette flotte légèrement au-dessus du sol. Ses cheveux violets ondulent sans vent. Un léger éclat de lumière émane de lui. Mais qui est donc ce jeune homme à l'air si mystérieux et ténébreux ? Attends... ça serait pas des takoyaki qu'il tient dans ses mains ?? Mais c une sirène le gars ? IL EST CANIBALE OU QUOI ??`, next:true },
  { bg:'hall', char:'rafayel', speaker:"Rafayel",
    text:()=>`Je viens des profondeurs de l'océan. J'ai traversé trois dimensions pour être ici. J'ai des pouvoirs divins ancestraux. *te tend une boîte* Tu veux du takoyaki ?`, next:true },

  // PREMIER CHOIX
  { bg:'hall', char:'none', speaker:"Narratrice",
    text:()=>`${playerName} les observe tous les trois. Une décision doit être prise. La musique de piano s'intensifie. Le ventilateur industriel s'emballe.`,
    choices:[
      { text:"🕵️ Répondre à Léon sur son problème de gel capillaire", action:()=>addHeart('leon',2), next:9 },
      { text:"💪 Demander à Rhea la recette des cookies", action:()=>addHeart('rhea',2), next:13 },
      { text:"🐟 Accepter le takoyaki de Rafayel", action:()=>addHeart('rafayel',2), next:17 },
    ]
  },

  // ROUTE LÉON — indices 9, 10, 11
  { bg:'hall', char:'leon', speaker:()=>playerName,
    text:()=>`J'ai du gel. C'est du gel anti-zombie d'ailleurs, il tient même sous la pluie d'acide.`, next:true },
  { bg:'hall', char:'leon', speaker:"Léon S. Kennedy",
    text:()=>`...Tu viens de sauver ma vie pour la deuxième fois aujourd'hui. La première fois c'était face à un zombie dans les toilettes du premier étage. Ne va pas aux toilettes du premier étage.`, next:true },
  { bg:'hall', char:'leon', speaker:"Narratrice",
    text:()=>`Léon prend le gel avec une main tremblante et vous regarde comme si vous étiez la promesse d'un monde sans biohazard. Un zombie passe en arrière-plan. Personne ne le remarque. C'est la routine.`,
    choices:[{ text:"Continuer ▶", action:()=>addHeart('leon',3), next:18 }] },

  // ROUTE RHEA — indices 12, 13, 14
  { bg:'hall', char:'rhea', speaker:()=>playerName,
    text:()=>`La recette des cookies… tu mets combien de grammes de beurre ?`, next:true },
  { bg:'hall', char:'rhea', speaker:"Rhea Ripley",
    text:()=>`250 grammes. Et tu les écrases à la main. Pas avec un fouet. À la main. C'est plus expressif, chérie.`, next:true },
  { bg:'hall', char:'rhea', speaker:"Narratrice",
    text:()=>`Rhea vous regarde avec un respect nouveau. Quelqu'un qui s'intéresse à ses cookies ET à son sport de combat. Elle sort un carnet rose plein de recettes et de prises de catch annotées côte à côte.`,
    choices:[{ text:"Continuer ▶", action:()=>addHeart('rhea',3), next:18 }] },

  // ROUTE RAFAYEL — indices 15, 16, 17
  { bg:'hall', char:'rafayel', speaker:()=>playerName,
    text:()=>`*prend une boulette de takoyaki* C'est… étonnamment délicieux pour quelqu'un qui vient de l'océan profond.`, next:true },
  { bg:'hall', char:'rafayel', speaker:"Rafayel",
    text:()=>`J'ai mis 3 000 ans à perfectionner cette recette. Les pouvoirs divins ne font pas tout. Il faut aussi une bonne sauce soja.`, next:true },
  { bg:'hall', char:'rafayel', speaker:"Narratrice",
    text:()=>`Rafayel sourit d'un sourire qui a probablement fait craquer des reines et des divinités marines. Vous vous demandez si l'assurance maladie couvre les dommages liés aux dieux de l'océan. Vous décidez de ne pas y penser.`,
    choices:[{ text:"Continuer ▶", action:()=>addHeart('rafayel',3), next:18 }] },

  // SCÈNE COMMUNE — index 18
  { bg:'salle_de_classe', char:'none', speaker:"Narratrice",
    text:()=>`La journée de cours commence. ${playerName} s'assoit en cours de "Stratégie Romantique Avancée", une matière obligatoire dans cette école très normale. Le professeur arrive, personne ne pose de questions.`, next:true },
  // index 19
  { bg:'salle_de_classe', char:'hakim', speaker:"Prof. DR Hakim",
    text:()=>`Bonjour. Aujourd'hui nous aborderons la 1ère leçon du chapitre 4 intitulé "Comment être une tana". Vous allez travailler sur l'étude de cas suivante : gérer TROIS prétendants simultanément sans se faire cramer. Note : l'incident de l'an dernier avec le dieu de la mer et l'agent du gouvernement ne se reproduira PAS.`, next:true },
  // index 20
  { bg:'hall', char:'lettre', speaker:"Narratrice",
    text:()=>`À la pause déjeuner, quelque chose d'étrange se produit. Un papillon bleu électrique se pose sur l'épaule de ${playerName}. Il porte une enveloppe cachetée.`, next:true },
  // index 21
  { bg:'hall', char:'lettre', speaker:"Papillon Mystérieux",
    text:()=>`*ne parle pas, c'est un papillon*   …   *mais il a clairement un air entendu*`,
    choices:[
      { text:"📩 Ouvrir l'enveloppe mystérieuse", action:()=>{}, next:22 },
      { text:"🤷 Ignorer le papillon (c'est peut-être juste un papillon)", action:()=>{}, next:25 },
    ]
  },

  // FIN SECRÈTE SILUS — indices 22, 23, 24
  { bg:'hall', char:'sylus', speaker:"Narratrice",
    text:()=>`${playerName} ouvre l'enveloppe. À l'intérieur : une seule phrase, écrite en encre argentée : "Je suis là depuis le début. Regarde bien." Et la signature : un S stylisé.`, next:true },
  { bg:'hall', char:'sylus', speaker:"Narratrice",
    text:()=>`${playerName} lève les yeux. À l'autre bout du couloir, appuyé contre un casier, un jeune homme aux cheveux argentés la regarde avec un sourire paisible. Il était là depuis le début du jeu. Vous ne l'aviez juste… pas remarqué.`,
    next:true, action:()=>{ secretFound=true; addHeart('silus',999); document.getElementById('stat-silus-wrap').style.display='flex'; } },
  { bg:'hall', char:'sylus', speaker:"???",
    text:()=>`…Je m'appelle Silus. Ou du moins, c'est ce qu'on m'appelle dans d'autres dimensions. Ici, je suis juste en train de manger un sandwich. Tu en veux ?`,
    choices:[{ text:"Continuer ▶", action:()=>showEnd('silus'), next:24 }] },

  // Route ignorer papillon — indices 25, 26
  { bg:'hall', char:'none', speaker:"Narratrice",
    text:()=>`${playerName} ignore le papillon. Le papillon repart, l'air déçu. Quelque part dans l'univers, quelqu'un soupire. C'est une fin alternative qui ne sera jamais connue.`, next:true },
  { bg:'hall', char:'none', speaker:"Narratrice",
    text:()=>`La journée se termine. Le soleil se couche sur l'Académie du Destin Romantique™. ${playerName} rentre chez elle avec dans le cœur la douce certitude qu'un choix final l'attend demain.`, next:true },

  // FIN NORMALE — index 27
  { bg:'hall', char:'none', speaker:"Narratrice",
    text:()=>`Le lendemain matin, ${playerName} sait. Son cœur a choisi. Ou du moins, les statistiques ont choisi pour son cœur, ce qui est probablement plus fiable.`,
    choices:[{ text:"Découvrir ma fin ▶", action:()=>{
      const m=Math.max(hearts.leon,hearts.rhea,hearts.rafayel);
      if(hearts.leon>=m) showEnd('leon');
      else if(hearts.rhea>=m) showEnd('rhea');
      else showEnd('rafayel');
    }, next:27 }] },
];

const endings = {
  leon:    { emoji:"❤️",  title:"FIN A — Le Gel et l'Amour",          char:'leon',    text:(n)=>`${n} et Léon Kennedy filent le parfait amour entre deux missions d'extermination de zombies. Leur premier rendez-vous a lieu dans un bunker gouvernemental classifié. C'est très romantique. Il y a des bougies. Et aussi des armes à feu.

💖 JOYEUX ANNIVERSAIRE MARGOTTE ! 💖` },

// ── AUDIO ──
const audio = {
  demarrage:  new Audio('audio/musique_de_demarrage.mp3'),
  dramatique: new Audio('audio/musique_dramatique.mp3'),
  click:      new Audio('audio/click_sound.mp3'),
  fin:        new Audio('audio/bruit_de_fin.mp3'),
};
audio.demarrage.loop  = true;
audio.dramatique.loop = true;
audio.demarrage.volume  = 0.6;
audio.dramatique.volume = 0.6;
audio.click.volume = 0.8;
audio.fin.volume   = 1.0;

// Démarre la musique d'écran de démarrage dès le premier clic utilisateur
// (obligatoire sur la plupart des navigateurs qui bloquent l'autoplay)
let audioBoostrapped = false;
document.addEventListener('click', function bootstrap(){
  if(audioBoostrapped) return;
  audioBoostrapped = true;
  audio.demarrage.play().catch(()=>{});
}, { once: false });

function playClick(){
  audio.click.currentTime = 0;
  audio.click.play().catch(()=>{});
}

function switchToGame(){
  audio.demarrage.pause();
  audio.demarrage.currentTime = 0;
  audio.dramatique.play().catch(()=>{});
}

function playEnd(){
  audio.dramatique.pause();
  audio.dramatique.currentTime = 0;
  audio.fin.currentTime = 0;
  audio.fin.play().catch(()=>{});
}

// ── FONCTIONS ──
function startGame(){
  const v=document.getElementById('player-name-input').value.trim();
  if(v) playerName=v;
  playClick();
  switchToGame();
  document.getElementById('start-screen').style.display='none';
  currentScene=0; renderScene();
}

function setBackground(key){
  const bg=document.getElementById('scene-bg');
  if(key && IMGS[key]){
    bg.style.backgroundImage=`url(${IMGS[key]})`;
    bg.style.backgroundColor='';
  } else {
    bg.style.backgroundImage='none';
    bg.style.backgroundColor='#1a0a2e';
  }
}

function setCharacter(key){
  const el=document.getElementById('character-display');
  if(key && key!=='none' && IMGS[key]){
    el.src=IMGS[key];
    el.style.opacity='1';
  } else {
    el.src=''; el.style.opacity='0';
  }
}

function renderScene(){
  const s=scenes[currentScene];
  if(!s||!s.text){ nextScene(); return; }

  setBackground(s.bg);
  setCharacter(s.char);

  const speakerEl=document.getElementById('speaker-name');
  const textEl=document.getElementById('dialog-text');
  const choicesEl=document.getElementById('choices');
  const nextBtn=document.getElementById('next-btn');

  const spk=typeof s.speaker==='function'?s.speaker():s.speaker;
  speakerEl.textContent=spk||'';
  speakerEl.style.display=spk?'inline-block':'none';

  textEl.className='';
  void textEl.offsetWidth;
  textEl.className='fade-in';
  textEl.textContent=typeof s.text==='function'?s.text():s.text;

  choicesEl.innerHTML='';
  if(s.choices){
    nextBtn.classList.add('hidden');
    s.choices.forEach(c=>{
      const btn=document.createElement('button');
      btn.className='choice-btn fade-in';
      btn.textContent=c.text;
      btn.onclick=()=>{ playClick(); if(c.action)c.action(); goToScene(c.next); };
      choicesEl.appendChild(btn);
    });
  } else {
    nextBtn.classList.remove('hidden');
  }

  if(s.action) s.action();
  updateStats();
}

function nextScene(){ playClick(); currentScene++; if(currentScene<scenes.length) renderScene(); }
function goToScene(n){ currentScene=n; renderScene(); }

function addHeart(who,amount){
  hearts[who]=(hearts[who]||0)+amount;
  updateStats(); spawnHeart();
}
function updateStats(){
  document.getElementById('stat-leon').textContent=hearts.leon;
  document.getElementById('stat-rhea').textContent=hearts.rhea;
  document.getElementById('stat-rafayel').textContent=hearts.rafayel;
  if(hearts.silus>0){
    document.getElementById('stat-silus').textContent='∞';
    document.getElementById('stat-silus-wrap').style.display='flex';
  }
}
function spawnHeart(){
  const h=document.createElement('div'); h.className='heart-pop'; h.textContent='💖';
  h.style.left=(30+Math.random()*40)+'%'; h.style.bottom='220px';
  document.body.appendChild(h); setTimeout(()=>h.remove(),1200);
}

function showEnd(who){
  playEnd();
  const e=endings[who];
  const es=document.getElementById('end-screen');
  document.getElementById('end-emoji').textContent=e.emoji;
  document.getElementById('end-title').textContent=e.title;
  document.getElementById('end-text').textContent=e.text(playerName);
  const ec=document.getElementById('end-char');
  if(e.char&&IMGS[e.char]){ ec.src=IMGS[e.char]; ec.style.display='block'; }
  else { ec.style.display='none'; }
  es.classList.add('visible');
}

document.getElementById('player-name-input').addEventListener('keydown',e=>{ if(e.key==='Enter') startGame(); });
document.getElementById('restart-btn').addEventListener('click',()=>{ playClick(); });
</script>
